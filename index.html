<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Date Night?</title>
  <style>
    :root {
      --bg: #fff5f6;
      --card-bg: #ffffff;
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --text: #2f3542;
      --border: #ffe0e3;
    }

    * {
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    html {
      height: -webkit-fill-available;
    }

    .card {
      background: var(--card-bg);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 107, 129, 0.15);
      width: 100%;
      max-width: 340px;
      text-align: center;
      position: relative;
    }

    h1 {
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.6rem;
      line-height: 1.3;
    }

    p {
      color: #747d8c;
      font-size: 1rem;
      margin-bottom: 24px;
      margin-top: 0;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 129, 0.2);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-no {
      background: #a4b0be;
      box-shadow: 0 4px 12px rgba(164, 176, 190, 0.2);
      transition: top 0.15s ease, left 0.15s ease;
      z-index: 999;
    }

    #step-2, #confirmation {
      display: none;
    }

    .section {
      margin-bottom: 24px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    input[type="time"] {
      width: 100%;
      padding: 14px;
      border: 3px dashed var(--primary);
      border-radius: 16px;
      font-size: 1.2rem;
      outline: none;
      background: #fff0f2;
      text-align: center;
      color: var(--text);
      -webkit-appearance: none;
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
    }

    .floating-heart {
      position: fixed;
      font-size: 28px;
      animation: floatUp 2s linear forwards;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Step 1: Yes or No -->
    <div id="step-1">
      <h1>Do you want to go on a date? 💕</h1>
      <p>Choose wisely!</p>
      
      <div class="btn-group">
        <button class="btn" id="yes-btn">Yes! 🥰</button>
        <button class="btn btn-no" id="no-btn">No 😜</button>
      </div>
    </div>

    <!-- Step 2: Time Picker -->
    <div id="step-2">
      <h1>Yay! What time works? ⏰</h1>
      <p>Pick a time for us!</p>

      <div class="section">
        <label>Select Time:</label>
        <input type="time" id="time-picker">
      </div>

      <button class="btn submit-btn" id="submit-btn">Lock It In! ✨</button>
    </div>

    <!-- Step 3: Confirmation -->
    <div id="confirmation">
      <h1>See you then! 🥰</h1>
      <p id="summary-text"></p>
      <p style="font-size: 0.9rem; color: #a4b0be;">(I'll pick you up!)</p>
    </div>

  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Replace with your Firebase configuration object:
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const confirmation = document.getElementById('confirmation');

    // Function to jump the "No" button when clicked/tapped
    function moveNoButton(e) {
      e.preventDefault(); // Prevents actual click triggering
      
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Ensure button stays well within the visible screen boundaries
      const maxX = window.innerWidth - btnWidth - 20;
      const maxY = window.innerHeight - btnHeight - 20;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Teleport on click or tap
    noBtn.addEventListener('click', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton, { passive: false });

    // "Yes" button opens time picker
    yesBtn.addEventListener('click', () => {
      step1.style.display = 'none';
      step2.style.display = 'block';
    });

    // Save to Firebase
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const time = document.getElementById('time-picker').value;

      if (!time) {
        alert('Please pick a time! ❤️');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending... 💌";

      try {
        await push(ref(database, 'date_responses'), {
          agreedToDate: true,
          time: time,
          submittedAt: new Date().toISOString()
        });

        for (let i = 0; i < 20; i++) { createHeart(); }

        step2.style.display = 'none';
        confirmation.style.display = 'block';

        document.getElementById('summary-text').innerHTML = 
          `Can't wait! Set for <b>${time}</b>!`;

      } catch (error) {
        console.error("Error saving data:", error);
        alert("Something went wrong saving your response. Please try again!");
        submitBtn.disabled = false;
        submitBtn.innerText = "Lock It In! ✨";
      }
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerText = ['💖', '💗', '✨', '🌸'][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = '100vh';
      heart.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
  </script>
</body>
</html>
