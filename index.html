<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Date Night?</title>
  
  <!-- Load Comic Neue from Google Fonts for reliable rendering on mobile/iOS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff5f6;
      --card-bg: #ffffff;
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --text: #2f3542;
      --border: #ffe0e3;
    }

    /* Force Comic Sans / Comic Neue globally */
    *, html, body, button, input, select, textarea {
      font-family: 'Comic Neue', "Comic Sans MS", "Comic Sans", cursive, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 16px;
      overflow: hidden;
    }

    html {
      height: -webkit-fill-available;
    }

    .card {
      background: var(--card-bg);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 107, 129, 0.15);
      width: 100%;
      max-width: 340px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    h1 {
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.6rem;
      line-height: 1.3;
      font-weight: 700;
    }

    p {
      color: #747d8c;
      font-size: 1rem;
      margin-bottom: 24px;
      margin-top: 0;
    }

    .gif-container {
      width: 100%;
      max-height: 180px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
    }

    .gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 129, 0.2);
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Continuous moving "No" button setup */
    .btn-no {
      background: #a4b0be;
      box-shadow: 0 4px 12px rgba(164, 176, 190, 0.2);
      position: fixed;
      z-index: 999;
      transition: left 0.4s ease-in-out, top 0.4s ease-in-out;
    }

    /* Floating No GIF when tapped */
    #no-gif-popup {
      position: fixed;
      width: 120px;
      height: 120px;
      border-radius: 16px;
      pointer-events: none;
      z-index: 10000;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      border: 3px solid white;
    }

    #step-2, #confirmation {
      display: none;
    }

    .section {
      margin-bottom: 24px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    input[type="time"] {
      width: 100%;
      padding: 14px;
      border: 3px dashed var(--primary);
      border-radius: 16px;
      font-size: 1.2rem;
      outline: none;
      background: #fff0f2;
      text-align: center;
      color: var(--text);
      -webkit-appearance: none;
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
    }

    .floating-heart {
      position: fixed;
      font-size: 28px;
      animation: floatUp 2s linear forwards;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Step 1: Yes or No -->
    <div id="step-1">
      <h1>Do you want to facetime ur dumbass ex bf? 💕</h1>
      <p>Choose wisely!</p>
      
      <div class="gif-container" id="yes-gif-box">
        <img src="yes.gif" alt="Yes reaction">
      </div>

      <div class="btn-group">
        <button class="btn" id="yes-btn">Yes! 🥰</button>
      </div>
    </div>

    <!-- Step 2: Time Picker -->
    <div id="step-2">
      <h1>Yay! Welche zeit willst du dir antun? :3 ⏰</h1>
      <p>PICK A TIMEEEEE !</p>

      <div class="section">
        <label>Select Time:</label>
        <input type="time" id="time-picker">
      </div>

      <button class="btn submit-btn" id="submit-btn">Lock It In! ✨</button>
    </div>

    <!-- Step 3: Confirmation -->
    <div id="confirmation">
      <h1>HEHEHEHE 🥰</h1>
      <p id="summary-text"></p>
      <p style="font-size: 0.9rem; color: #a4b0be;">(I'll pick you up!)</p>
    </div>

  </div>

  <!-- Moving "No" button -->
  <button class="btn btn-no" id="no-btn">No 😜</button>

  <!-- Popup No GIF -->
  <img id="no-gif-popup" src="no.gif" alt="No reaction">

  <script>
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const confirmation = document.getElementById('confirmation');
    const yesGifBox = document.getElementById('yes-gif-box');
    const noGifPopup = document.getElementById('no-gif-popup');

    // Calculate random position for "No" button
    function moveNoButton() {
      const btnWidth = noBtn.offsetWidth || 100;
      const btnHeight = noBtn.offsetHeight || 50;

      const maxX = window.innerWidth - btnWidth - 20;
      const maxY = window.innerHeight - btnHeight - 20;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Start continuous moving loop
    moveNoButton();
    const moveInterval = setInterval(moveNoButton, 450);

    // Play no.gif popup if she manages to click/tap No
    function handleNoClick(e) {
      e.preventDefault();

      const rect = noBtn.getBoundingClientRect();
      noGifPopup.style.left = `${rect.left}px`;
      noGifPopup.style.top = `${rect.top - 130}px`;
      noGifPopup.style.display = 'block';

      setTimeout(() => {
        noGifPopup.style.display = 'none';
      }, 1200);

      moveNoButton();
    }

    noBtn.addEventListener('click', handleNoClick);
    noBtn.addEventListener('touchstart', handleNoClick, { passive: false });

    // Handle "Yes" click: play yes.gif, then advance to Step 2
    yesBtn.addEventListener('click', () => {
      clearInterval(moveInterval);
      noBtn.style.display = 'none';
      yesBtn.style.display = 'none';
      
      // Play yes.gif briefly before showing time picker
      yesGifBox.style.display = 'block';

      setTimeout(() => {
        step1.style.display = 'none';
        step2.style.display = 'block';
      }, 1500);
    });

    // Send her response directly to Formspree
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const time = document.getElementById('time-picker').value;

      if (!time) {
        alert('Please pick a time! ❤️');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending... 💌";

      try {
        const response = await fetch('https://formspree.io/f/mgawqkna', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            agreedToDate: 'Yes! 🥰',
            selectedTime: time
          })
        });

        if (response.ok) {
          for (let i = 0; i < 20; i++) { createHeart(); }

          step2.style.display = 'none';
          confirmation.style.display = 'block';

          // Format time to 12-hour display
          const [hours, minutes] = time.split(':');
          const dateObj = new Date();
          dateObj.setHours(hours, minutes);
          const formattedTime = dateObj.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

          document.getElementById('summary-text').innerHTML = 
            `Can't wait! Set for <b>${formattedTime}</b>!`;
        } else {
          throw new Error('Formspree submission failed');
        }

      } catch (error) {
        console.error("Error submitting response:", error);
        alert("Something went wrong saving your response. Please try again!");
        submitBtn.disabled = false;
        submitBtn.innerText = "Lock It In! ✨";
      }
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerText = ['💖', '💗', '✨', '🌸'][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = '100vh';
      heart.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
  </script>
</body>
</html>
